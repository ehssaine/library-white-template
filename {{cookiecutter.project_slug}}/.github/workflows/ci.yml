{%- if cookiecutter.use_github_actions == "yes" -%}
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["{{ cookiecutter.min_python_version }}", "{{ cookiecutter.python_version }}"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python {{ "{{" }} matrix.python-version {{ "}}" }}
        run: uv python install {{ "{{" }} matrix.python-version {{ "}}" }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest --junitxml=results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-{{ "{{" }} matrix.python-version {{ "}}" }}
          path: results.xml
{%- else -%}
# GitHub Actions CI is disabled.
# Enable it by setting ``use_github_actions`` to "yes" when generating the project.
{%- endif %}
